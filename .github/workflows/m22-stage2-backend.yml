name: M22 Stage 2 Backend Security and Release Readiness
on:
  push:
    branches: [fix/m20-admin-ui-modal-filters-2026-11-06]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m22-stage2-backend
  cancel-in-progress: true

jobs:
  sqlite-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, fileinfo
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: PHP syntax and read-only route preflight
        run: |
          php -l app/Http/Controllers/Api/M22AccountController.php
          php -l app/Http/Controllers/Api/M22SupportController.php
          php -l app/Http/Controllers/Admin/M22SupportAdminController.php
          php -l tests/Feature/M22Stage2SecurityReleaseTest.php
          php -l app/Services/M24TwoFactorService.php
          php -l app/Http/Controllers/Api/M24TwoFactorController.php
          php -l tests/Feature/M24TwoFactorSecurityTest.php
          php artisan migrate:fresh --force
          php artisan view:cache
          php artisan route:list --path=api/v1/me
          php artisan route:list --path=api/v1/support
          php artisan route:list --path=admin/support
      - name: M22 stages 1 and 2 security and integration
        run: |
          php artisan test tests/Feature/M22ProfileSecuritySupportTest.php tests/Feature/M22Stage2SecurityReleaseTest.php tests/Feature/M24TwoFactorSecurityTest.php
      - name: Existing authentication and notifications regressions
        run: |
          php artisan test tests/Feature/M2EmailOtpAuthTest.php tests/Feature/M20RemindersNotificationsTest.php

  mysql-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: m22_stage2_ci
          MYSQL_DATABASE: sign2digital_m22_stage2
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pm22_stage2_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sign2digital_m22_stage2
      DB_USERNAME: root
      DB_PASSWORD: m22_stage2_ci
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, gd, fileinfo
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Production-engine schema and privacy acceptance
        run: |
          php artisan migrate:fresh --force
          php artisan test tests/Feature/M22ProfileSecuritySupportTest.php tests/Feature/M22Stage2SecurityReleaseTest.php tests/Feature/M24TwoFactorSecurityTest.php
