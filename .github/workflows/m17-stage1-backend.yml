name: M17 Stage 1 Invoice Ledger Backend
on:
  push:
    branches: [feature/m12-site-reports-meeting-minutes-2026-11-04]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sign2digital-m17-invoice-backend
  cancel-in-progress: true
jobs:
  invoice-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, fileinfo, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Invoice schema and protected routes compile
        run: |
          for f in database/migrations/2026_11_05_050000_create_invoice_management_tables.php app/Services/InvoiceService.php app/Http/Controllers/Api/InvoiceController.php app/Http/Controllers/Admin/InvoiceController.php tests/Feature/M17InvoiceManagementTest.php; do php -l "$f" || exit 1; done
          php artisan view:cache
          php artisan route:list --path=api/v1/invoices
          php artisan route:list --path=admin/invoices
      - name: Invoice and M12-M16 regression tests
        run: |
          php artisan test --filter='M(17InvoiceManagement|16DepositManagement|15LabourTracking|14ExpenseTracking|13WorkAcceptance|12ReportsManagement)Test'
