name: M25 App Store Compliance Backend
on:
  push:
    branches:
      - fix/m20-admin-ui-modal-filters-2026-11-06
    paths:
      - '.github/workflows/m25-compliance.yml'
      - 'app/**'
      - 'routes/**'
      - 'config/m25_apple.php'
      - 'database/migrations/**'
      - 'tests/Feature/M25PrivacyComplianceTest.php'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, openssl, fileinfo
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Syntax check
        run: find app database/migrations routes -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: M25 and adjacent security tests (no live services)
        run: php artisan test --filter='M25PrivacyComplianceTest|AppleMobileAuthTest|PublicWebsiteAndDeletionTest|M24TwoFactorSecurityTest|M23SubscriptionStage1Test|M23StripeBillingStage2Test'
