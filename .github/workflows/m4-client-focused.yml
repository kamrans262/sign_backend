name: M4 Client Management focused verification

on:
  push:
    branches:
      - feature/m4-client-management-2026-11-03
    paths:
      - '.github/workflows/m4-client-focused.yml'
      - 'app/Http/Controllers/Api/ClientController.php'
      - 'app/Http/Controllers/Admin/ClientController.php'
      - 'app/Models/Client.php'
      - 'app/Models/Company.php'
      - 'routes/api.php'
      - 'routes/web.php'
      - 'database/migrations/2026_11_03_300000_create_company_clients_table.php'
      - 'resources/views/admin/clients/**'
      - 'resources/views/admin/layout.blade.php'
      - 'tests/Feature/M4ClientManagementTest.php'
      - 'tests/Feature/M4Stage2SecurityAndReleaseTest.php'
      - 'scripts/m3_m4_release_preflight.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s2d-m4-backend
  cancel-in-progress: true

jobs:
  m4-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-ci-only
          MYSQL_DATABASE: sign2digital_m4_ci
          MYSQL_USER: sign_ci
          MYSQL_PASSWORD: sign-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-only"
          --health-interval=5s
          --health-timeout=4s
          --health-retries=25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, pdo_mysql, mbstring, openssl, fileinfo
          coverage: none
      - name: Resolve locked packages
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare isolated environment
        run: cp .env.example .env && php artisan key:generate
      - name: Lint scoped PHP and compile existing admin views
        run: php -l app/Http/Controllers/Api/ClientController.php && php -l app/Http/Controllers/Admin/ClientController.php && php -l routes/api.php && php -l routes/web.php && php -l scripts/m3_m4_release_preflight.php && php artisan view:cache
      - name: Test combined M3 and M4 tenant workflows on SQLite
        run: php artisan test --filter='M(3CompanyManagement|4ClientManagement|4Stage2SecurityAndRelease)Test'
      - name: Test combined M3 and M4 tenant workflows on MySQL 8
        env:
          DB_CONNECTION: mysql
          DB_URL: ''
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sign2digital_m4_ci
          DB_USERNAME: sign_ci
          DB_PASSWORD: sign-ci-only
        run: php artisan test --filter='M(3CompanyManagement|4ClientManagement|4Stage2SecurityAndRelease)Test'
      - name: Guard M2 email OTP and admin authentication
        run: php artisan test --filter=M2EmailOtpAuthTest
