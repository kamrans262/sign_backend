name: M3 company-management focused verification

on:
  push:
    branches:
      - feature/m3-company-management-2026-11-03
    paths:
      - '.github/workflows/m3-company-focused.yml'
      - 'app/Http/Controllers/Api/CompanyManagementController.php'
      - 'app/Http/Middleware/EnsureCompanyPermission.php'
      - 'app/Models/Company.php'
      - 'app/Models/CompanyInvitation.php'
      - 'app/Mail/CompanyInvitationMail.php'
      - 'database/migrations/2026_11_03_200000_create_company_invitations_and_active_context.php'
      - 'resources/views/mail/company-invitation.blade.php'
      - 'routes/api.php'
      - 'bootstrap/app.php'
      - 'tests/Feature/M3CompanyManagementTest.php'
      - 'resources/views/admin/companies/form.blade.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s2d-m3-company
  cancel-in-progress: true

jobs:
  company-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-ci-only
          MYSQL_DATABASE: sign2digital_ci
          MYSQL_USER: sign_ci
          MYSQL_PASSWORD: sign-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-only"
          --health-interval=5s
          --health-timeout=4s
          --health-retries=25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite, pdo_mysql, mbstring, openssl, fileinfo
          coverage: none
      - name: Resolve packages
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare isolated environment
        run: cp .env.example .env && php artisan key:generate
      - name: Verify M3 syntax and views
        run: php -l app/Http/Controllers/Api/CompanyManagementController.php && php -l app/Http/Middleware/EnsureCompanyPermission.php && php artisan view:cache
      - name: Test M3 only on SQLite
        run: php artisan test --filter=M3CompanyManagementTest
      - name: Test M3 only on MySQL 8
        env:
          DB_CONNECTION: mysql
          DB_URL: ''
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sign2digital_ci
          DB_USERNAME: sign_ci
          DB_PASSWORD: sign-ci-only
        run: php artisan test --filter=M3CompanyManagementTest
      - name: Verify previous M2 OTP and admin logic
        run: php artisan test --filter=M2EmailOtpAuthTest
