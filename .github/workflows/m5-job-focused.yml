name: M5 Job Management focused backend verification

on:
  push:
    branches:
      - feature/m5-job-management-2026-11-03
    paths:
      - '.github/workflows/m5-job-focused.yml'
      - 'app/Http/Controllers/Api/ServiceJobController.php'
      - 'app/Http/Controllers/Api/ClientController.php'
      - 'app/Http/Controllers/Admin/ServiceJobController.php'
      - 'app/Models/ServiceJob.php'
      - 'app/Models/Company.php'
      - 'app/Models/Client.php'
      - 'database/migrations/2026_11_03_400000_create_service_jobs_tables.php'
      - 'routes/api.php'
      - 'routes/web.php'
      - 'resources/views/admin/jobs/**'
      - 'resources/views/admin/layout.blade.php'
      - 'tests/Feature/M5ServiceJobManagementTest.php'
      - 'tests/Feature/M5Stage2SecurityAndReleaseTest.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sign2digital-m5-backend
  cancel-in-progress: true

jobs:
  m5-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-ci-only
          MYSQL_DATABASE: sign2digital_m5_ci
          MYSQL_USER: sign_ci
          MYSQL_PASSWORD: sign-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-only"
          --health-interval=5s
          --health-timeout=4s
          --health-retries=25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, pdo_mysql, mbstring, openssl, fileinfo
          coverage: none
      - name: Resolve locked PHP packages
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare isolated environment
        run: cp .env.example .env && php artisan key:generate
      - name: Lint scoped M5 PHP and compile admin Blade
        run: php -l app/Models/ServiceJob.php && php -l app/Models/Company.php && php -l app/Models/Client.php && php -l app/Http/Controllers/Api/ServiceJobController.php && php -l app/Http/Controllers/Api/ClientController.php && php -l app/Http/Controllers/Admin/ServiceJobController.php && php -l database/migrations/2026_11_03_400000_create_service_jobs_tables.php && php -l routes/api.php && php -l routes/web.php && php -l tests/Feature/M5Stage2SecurityAndReleaseTest.php && php artisan view:cache
      - name: Verify M4 client and M5 job flows with SQLite
        run: php artisan test --filter='M(4ClientManagement|5ServiceJobManagement|5Stage2SecurityAndRelease)Test'
      - name: Verify M4 client and M5 job flows with MySQL 8
        env:
          DB_CONNECTION: mysql
          DB_URL: ''
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sign2digital_m5_ci
          DB_USERNAME: sign_ci
          DB_PASSWORD: sign-ci-only
        run: php artisan test --filter='M(4ClientManagement|5ServiceJobManagement)Test'
