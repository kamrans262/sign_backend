name: Sign2Digital M16-M17 focused invoice/deposit QA
on:
  push:
    branches: [fix/m20-admin-ui-modal-filters-2026-11-06]
    paths:
      - '.github/workflows/qa-m16-m17-custom-method-quote-pdf.yml'
      - 'app/Services/DepositService.php'
      - 'app/Services/InvoiceDocumentService.php'
      - 'database/migrations/2026_11_12_010000_add_custom_payment_method_to_job_deposits.php'
      - 'tests/Feature/M16DepositManagementTest.php'
      - 'tests/Feature/M17InvoiceIssuanceTest.php'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, fileinfo, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Syntax and migration safety
        run: |
          php -l app/Services/DepositService.php
          php -l app/Services/InvoiceDocumentService.php
          php -l database/migrations/2026_11_12_010000_add_custom_payment_method_to_job_deposits.php
      - name: Deposit and immutable invoice PDF regressions
        run: php artisan test --filter='M(16DepositManagement|17InvoiceIssuance)Test'
