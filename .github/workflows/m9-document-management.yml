name: M9 Document Management focused backend verification

on:
  push:
    branches: [feature/m9-document-management-2026-11-04]
    paths:
      - '.github/workflows/m9-document-management.yml'
      - 'app/Services/DocumentCatalogService.php'
      - 'app/Http/Controllers/Api/DocumentController.php'
      - 'app/Http/Controllers/Admin/DocumentController.php'
      - 'database/migrations/2026_11_04_030000_create_document_management_tables.php'
      - 'resources/views/admin/documents/**'
      - 'resources/views/admin/layout.blade.php'
      - 'routes/**'
      - 'tests/Feature/M9DocumentManagementTest.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sign2digital-m9-backend
  cancel-in-progress: true

jobs:
  m9-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-ci-only
          MYSQL_DATABASE: sign2digital_m9_ci
          MYSQL_USER: sign_ci
          MYSQL_PASSWORD: sign-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-only"
          --health-interval=5s
          --health-timeout=4s
          --health-retries=25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, pdo_mysql, mbstring, openssl, fileinfo
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Lint M9 code and existing routes
        run: |
          for file in app/Services/DocumentCatalogService.php app/Http/Controllers/Api/DocumentController.php app/Http/Controllers/Admin/DocumentController.php database/migrations/2026_11_04_030000_create_document_management_tables.php tests/Feature/M9DocumentManagementTest.php routes/api.php routes/web.php; do php -l "$file" || exit 1; done
          php artisan view:cache
          php artisan route:list --path=api/v1/documents
          php artisan route:list --path=admin/documents
      - name: M9 SQLite isolated test database
        run: php artisan test --filter='M9DocumentManagementTest'
      - name: M9 MySQL 8 isolated test database
        env:
          DB_CONNECTION: mysql
          DB_URL: ''
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sign2digital_m9_ci
          DB_USERNAME: sign_ci
          DB_PASSWORD: sign-ci-only
        run: php artisan test --filter='M9DocumentManagementTest'
