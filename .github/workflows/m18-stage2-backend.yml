name: M18 Stage 2 Immutable General Documents
on:
  push:
    branches: [feature/m12-site-reports-meeting-minutes-2026-11-04]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sign2digital-m18-stage2-backend
  cancel-in-progress: true
jobs:
  general-document-issuance:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, fileinfo, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: PHP lint, migration and route/view compilers
        run: |
          for f in app/Services/GeneralDocumentIssueService.php app/Http/Controllers/Api/GeneralDocumentIssueController.php app/Http/Controllers/Api/PublicGeneralDocumentController.php app/Http/Controllers/Admin/GeneralDocumentController.php app/Services/DocumentCatalogService.php database/migrations/2026_11_05_080000_create_general_document_issuance.php tests/Feature/M18GeneralDocumentIssueTest.php; do php -l "$f" || exit 1; done
          php artisan migrate --force
          php artisan view:cache
          php artisan route:list --path=general-document
          php artisan route:list --path=general-sign
          php artisan route:list --path=api/v1/general-documents
      - name: M18 approved PDF and signed artifact acceptance
        run: php artisan test --filter='M18GeneralDocument(Issue)?Test'
      - name: Financial, catalog and signature regression
        run: php artisan test --filter='M(17InvoiceIssuance|9DocumentManagement|8SignatureRequestFoundation|13WorkAcceptance)Test'
  mysql-migration-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: m18_ci_only
          MYSQL_DATABASE: sign2digital_m18_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pm18_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sign2digital_m18_ci
      DB_USERNAME: root
      DB_PASSWORD: m18_ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, fileinfo, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Fresh isolated MySQL 8.4 schema rehearsal (never Hostinger)
        run: php artisan migrate:fresh --force
      - name: Check general-document issue, signature, link and delivery foreign keys
        run: |
          php artisan tinker --execute='$rows=\Illuminate\Support\Facades\DB::select("select CONSTRAINT_NAME from information_schema.REFERENTIAL_CONSTRAINTS where CONSTRAINT_SCHEMA = ? and TABLE_NAME in (?,?,?,?)", ["sign2digital_m18_ci","general_document_customer_links","general_document_signature_requests","general_document_deliveries","work_acceptance_customer_photos"]);$names=array_map(static fn($r)=>$r->CONSTRAINT_NAME,$rows);foreach(["m13_customer_photo_request_fk","m18_link_issue_fk","m18_sign_issue_fk","m18_delivery_issue_fk","m18_delivery_link_fk","m18_delivery_sign_fk"] as $name){if(!in_array($name,$names,true)){throw new \RuntimeException("Missing verified MySQL FK ".$name);}}echo "M18_MYSQL_FOREIGN_KEYS_VERIFIED";'
      - name: M18 issue and customer/signature flow on isolated MySQL
        run: php artisan test tests/Feature/M18GeneralDocumentIssueTest.php
